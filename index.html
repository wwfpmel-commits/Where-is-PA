<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zoom to protected area</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); width: 220px; font-size: 13px;
  }
  #panel button {
    display: block; width: 100%; margin: 4px 0; padding: 7px;
    border: 1px solid #2d6a4f; background: #fff; color: #2d6a4f;
    border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  #panel button:hover { background: #2d6a4f; color: #fff; }
  #step { font-weight: 600; margin-bottom: 4px; }
  #msg { color: #555; margin-top: 6px; line-height: 1.35; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="step">Loading…</div>
  <div id="buttons"></div>
  <button id="btnPlay">▶ Play all steps</button>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
  // =====================================================================
  //  SETTINGS
  // =====================================================================
  const FLY_MS   = 3000;   // movement time per step (milliseconds)
  const PAUSE_MS = 1500;   // pause after arriving, before the next step
  const START_MS = 2000;   // wait on the first step before moving
  const KEEP_PREVIOUS = true;  // true: earlier layers stay visible after their turn
                               // (a step with keep:false disappears when you leave it)

  // Edit only this list to reuse the map for another case.
  // All files must be in the same folder as this HTML.
  //   view            = camera move only (no file), e.g. the globe
  //   type            = 'point' or 'polygon'
  //   labelField      = attribute used for the label (null = auto-detect)
  //   labelFallback   = label text if no attribute is found
  //   label           = {text, pos:[lng,lat], size, spacing} fixed custom label
  const STEPS = [
    { id: 'world1', title: 'World',
      view: { center: [60, 20], zoom: 1.4 } },

    { id: 'start', title: 'Start location', type: 'point',
      file: 'Start_Point.geojson', color: '#ff4d6d', zoom: 12,
      labelField: null, labelFallback: 'Meeet' },

    { id: 'world2', title: 'World',
      view: { center: [105, 15], zoom: 1.4 } },

    { id: 'country', title: 'Cambodia', type: 'polygon',
      file: 'Cambodia_Boundary.geojson', color: '#ffffff', fill: false, dash: true,
      label: { text: 'CAMBODIA', pos: [104.9, 12.7], size: 22, spacing: 0.25 } },

    { id: 'province', title: 'Province', type: 'polygon',
      file: 'MDK_Province_Boundary.geojson', color: '#00e5ff', fillOpacity: 0.08,
      labelField: 'HRName', labelFallback: 'Mondulkiri Province', labelSize: 20 },

    { id: 'area', title: 'Protected area', type: 'polygon',
      file: 'SWS and PPWS Boundary.geojson', color: '#ffd60a', fillOpacity: 0.2,
      labelField: null, labelFallback: 'Protected Area', labelSize: 18 }
  ];
  // =====================================================================

  const PREFER = ['name', 'name_en', 'pa_name', 'paname', 'pa_name_en', 'prov_name',
                  'province', 'adm1_en', 'adm1_name', 'nameen', 'label', 'site', 'sitename'];
  const FONT = ['Open Sans Semibold'];
  const FADE = { duration: 600 };
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const firstView = (STEPS.find(s => s.view) || {}).view || { center: [105, 15], zoom: 1.4 };

  const map = new maplibregl.Map({
    container: 'map',
    center: firstView.center,
    zoom: firstView.zoom,
    style: {
      version: 8,
      projection: { type: 'globe' },
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        imagery: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 19,
          attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
        }
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': '#000' } },
        { id: 'imagery', type: 'raster', source: 'imagery' }
      ]
    }
  });
  map.addControl(new maplibregl.NavigationControl());

  let navToken = 0, runId = 0;

  // ---------- helpers ----------
  function getBounds(gj) {
    const b = new maplibregl.LngLatBounds();
    const geoms = gj.features ? gj.features.map(f => f.geometry) : [gj.geometry || gj];
    (function walk(c) {
      if (typeof c[0] === 'number') b.extend(c);
      else c.forEach(walk);
    })(geoms.filter(Boolean).map(g => g.coordinates));
    return b;
  }

  function detectField(gj, forced) {
    if (forced) return forced;
    const feats = gj.features || [];
    const keys = feats.length ? Object.keys(feats[0].properties || {}) : [];
    for (const p of PREFER) {
      const hit = keys.find(k => k.toLowerCase() === p);
      if (hit) return hit;
    }
    return keys.find(k => /name/i.test(k)) || null;
  }

  function setLabels(gj, field, fallback) {
    (gj.features || []).forEach(f => {
      f.properties = f.properties || {};
      f.properties._label = (field && f.properties[field]) ? String(f.properties[field]) : fallback;
    });
  }

  // ---------- build layers for one step ----------
  function addStep(s, gj) {
    const id = s.id;
    s.layers = [];
    const field = detectField(gj, s.labelField);
    setLabels(gj, field, s.labelFallback || s.title);
    map.addSource(id, { type: 'geojson', data: gj });

    if (s.type === 'point') {
      map.addLayer({ id: id + '-pt', type: 'circle', source: id, paint: {
        'circle-radius': 8, 'circle-color': s.color,
        'circle-stroke-color': '#ffffff', 'circle-stroke-width': 2,
        'circle-opacity': 0, 'circle-stroke-opacity': 0,
        'circle-opacity-transition': FADE, 'circle-stroke-opacity-transition': FADE } });
      s.layers.push([id + '-pt', 'circle-opacity', 1], [id + '-pt', 'circle-stroke-opacity', 1]);
      s.clickLayer = id + '-pt';
      const c = getBounds(gj).getCenter();
      s.view = { center: [c.lng, c.lat], zoom: s.zoom || 12 };
    } else {
      if (s.fill !== false) {
        map.addLayer({ id: id + '-fill', type: 'fill', source: id, paint: {
          'fill-color': s.color, 'fill-opacity': 0, 'fill-opacity-transition': FADE } });
        s.layers.push([id + '-fill', 'fill-opacity', s.fillOpacity ?? 0.15]);
        s.clickLayer = id + '-fill';
      }
      map.addLayer({ id: id + '-line', type: 'line', source: id, paint: {
        'line-color': s.color, 'line-width': 2.5,
        ...(s.dash ? { 'line-dasharray': [3, 2] } : {}),
        'line-opacity': 0, 'line-opacity-transition': FADE } });
      s.layers.push([id + '-line', 'line-opacity', 1]);
      s.bounds = getBounds(gj);
    }

    // label (one label point per feature, so the name is not repeated)
    s.labelId = id + '-label';
    const textPaint = { 'text-color': s.color, 'text-halo-color': '#000000', 'text-halo-width': 2,
                        'text-opacity': 0, 'text-opacity-transition': FADE };
    if (s.label) {
      map.addSource(id + '-lbl', { type: 'geojson', data: { type: 'Feature',
        properties: { name: s.label.text },
        geometry: { type: 'Point', coordinates: s.label.pos } } });
      map.addLayer({ id: s.labelId, type: 'symbol', source: id + '-lbl',
        layout: { 'text-field': ['get', 'name'], 'text-font': FONT, 'text-size': s.label.size || 20,
                  'text-letter-spacing': s.label.spacing || 0, 'text-allow-overlap': true },
        paint: textPaint });
    } else {
      const labelPts = { type: 'FeatureCollection', features: (gj.features || []).map(f => {
        const c = getBounds(f).getCenter();
        return { type: 'Feature', properties: { _label: f.properties._label },
                 geometry: { type: 'Point', coordinates: [c.lng, c.lat] } };
      }) };
      map.addSource(id + '-lbl', { type: 'geojson', data: labelPts });
      map.addLayer({ id: s.labelId, type: 'symbol', source: id + '-lbl',
        layout: { 'text-field': ['get', '_label'], 'text-font': FONT,
                  'text-size': s.labelSize || 20, 'text-allow-overlap': true,
                  ...(s.type === 'point' ? { 'text-anchor': 'top', 'text-offset': [0, 1] } : {}) },
        paint: textPaint });
    }

    // click popup (only once the layer has appeared)
    if (s.clickLayer) {
      map.on('click', s.clickLayer, e => {
        if (!s.shown) return;
        const p = e.features[0].properties || {};
        const rows = Object.entries(p).filter(([k]) => k !== '_label')
          .map(([k, v]) => `<b>${k}</b>: ${v}`).join('<br>');
        if (rows) new maplibregl.Popup().setLngLat(e.lngLat).setHTML(rows).addTo(map);
      });
    }
    s.ok = true;
  }

  // ---------- visibility ----------
  function render(visibleIds, labelId) {
    STEPS.forEach(s => {
      if (!s.layers) return;
      const on = visibleIds.includes(s.id);
      s.shown = on;
      s.layers.forEach(([lid, prop, op]) => map.setPaintProperty(lid, prop, on ? op : 0));
      map.setPaintProperty(s.labelId, 'text-opacity', s.id === labelId ? 1 : 0);
    });
  }

  const usable = s => s.view || s.ok;

  // ---------- camera ----------
  // Layers stay hidden until the camera arrives, then fade in.
  function goStep(i, instant) {
    const s = STEPS[i];
    if (!usable(s)) { $('msg').textContent = s.title + ': file not loaded.'; return Promise.resolve(); }
    const my = ++navToken;
    $('step').textContent = `Step ${i + 1}: ${s.title}`;

    const prev = KEEP_PREVIOUS
      ? STEPS.slice(0, i).filter(x => x.keep !== false).map(x => x.id) : [];
    render(prev, null);

    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        if (my === navToken) render(prev.concat(s.id), s.id);
        resolve();
      };

      if (instant) {
        if (s.view) map.jumpTo(s.view); else map.fitBounds(s.bounds, { duration: 0, padding: 40 });
        finish();
        return;
      }
      if (s.view) map.flyTo({ ...s.view, duration: FLY_MS });
      else map.fitBounds(s.bounds, { duration: FLY_MS, padding: 40 });
      map.once('moveend', finish);
      setTimeout(finish, FLY_MS + 1000);   // safety net
    });
  }

  async function playAll(from = 0) {
    const run = ++runId;
    for (let i = from; i < STEPS.length; i++) {
      if (!usable(STEPS[i])) continue;
      await goStep(i);
      if (run !== runId) return;
      await sleep(PAUSE_MS);
      if (run !== runId) return;
    }
  }

  // ---------- panel ----------
  STEPS.forEach((s, i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1}. ${s.title}`;
    b.onclick = () => { runId++; goStep(i); };
    $('buttons').appendChild(b);
  });
  $('btnPlay').onclick = () => playAll(0);

  // ---------- load everything ----------
  map.on('load', async () => {
    const failed = [];
    for (const s of STEPS) {
      if (!s.file) continue;
      try {
        const r = await fetch(encodeURI(s.file));
        if (!r.ok) throw new Error(r.status);
        addStep(s, await r.json());
      } catch (e) { failed.push(s.file); console.warn(s.file, e); }
    }
    if (failed.length) {
      $('msg').innerHTML = 'Could not read: ' + failed.join(', ') +
        '<br>Open this page with <b>run_map.bat</b> and check the file names.';
    }
    const first = STEPS.findIndex(usable);
    if (first < 0) return;
    await goStep(first, true);
    await sleep(START_MS);
    playAll(first + 1);
  });
</script>
</body>
</html>
